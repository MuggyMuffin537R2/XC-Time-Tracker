<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Split Taker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d9480f">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1b1b1a;--mut:#77756e;--ac:#d9480f;--ln:#e4e2db;--ok:#2b8a3e;--bad:#c92a2a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--tx:#f1efe8;--mut:#a09d92;--ac:#ff7a3d;--ln:#35342f;--ok:#69db7c;--bad:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#222220;--tx:#f1efe8;--mut:#a09d92;--ac:#ff7a3d;--ln:#35342f;--ok:#69db7c;--bad:#ff8787;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing!important}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 8px}
.list{position:relative}
.row{height:56px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:0 12px 0 0;margin-bottom:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.drag{background:color-mix(in srgb,var(--ac) 16%,var(--card));border-color:var(--ac);box-shadow:0 8px 22px #0005;z-index:5;position:relative}
.h{touch-action:none;cursor:grab;font-size:22px;color:var(--mut);padding:0 8px 0 14px;height:100%;display:flex;align-items:center;user-select:none;-webkit-user-select:none}
.row.drag .h{color:var(--ac)}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-weight:400;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;padding:0 6px}
.add{display:flex;gap:8px;margin-bottom:12px;align-items:center}
input,select{flex:1;min-width:0;width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.add input{width:auto}
.add .sm{flex:0 0 100px}
.add .lb{flex:1;font-weight:600}
button.p{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:12px 18px;cursor:pointer}
button.p:disabled{opacity:.4}
button.s{font:inherit;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);padding:10px 16px;cursor:pointer}
.hint{color:var(--mut);font-size:14px;margin:0 0 10px}
.clock{font:700 56px/1.1 ui-monospace,Menlo,monospace;text-align:center;margin:8px 0}
.lap{width:100%;height:96px;font-size:26px;border-radius:16px;margin-bottom:12px}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tab{flex:none;font:inherit;font-size:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.bar .tab{padding:12px 14px;font-size:16px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.grid{display:flex;gap:8px}
.slots{width:100px;flex:none}
.slot{height:56px;margin-bottom:8px;display:flex;flex-direction:column;justify-content:center;padding-left:4px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.slot b{font-size:15px;font-family:system-ui,sans-serif}
.slot small{color:var(--mut);font-size:12px}
.slot span[data-ti]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#act{flex:1;min-width:0}
.b{font-size:13px;font-weight:700;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--mut)}
.pd{color:var(--mut);font-size:12px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card ol{margin:6px 0 0;padding-left:22px}.card li{padding:2px 0;font-weight:600}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mdl{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.rr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding:4px 0;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.rr input{margin:4px 8px 4px 0;padding:8px 10px;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-weight:700;border:0;background:none;color:var(--mut);padding:10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 8px;font-weight:600;font-size:16px;color:var(--tx);cursor:pointer}
.flash{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ac);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;display:none;box-shadow:0 4px 14px #0004;white-space:nowrap}
textarea{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font-family:ui-monospace,Menlo,monospace}
summary{cursor:pointer;margin:8px 0}
</style></head><body><main id="app"></main><div id="modal"></div>


<script src="qrgen.js"></script>
<script src="jsQR.js"></script>
<script>
const $=s=>document.querySelector(s);
let S={phase:'setup',order:[],pred:[],marks:[],def:{label:'Marker 1',dist:''},total:'',unit:'mi',markers:[],cur:0,start:0,final:0,raf:0,nid:1,rid:'',epoch:0,flash:'',invRid:'',munit:'mi',tdraft:'',hinv:null,hsel:[],hm:[],hc:0,modal:null,draft:null};
const M=()=>S.markers[S.cur];
const mks=()=>S.marks.length?S.marks:[S.def];
const fmt=ms=>{const t=Math.floor(ms/10),c=t%100,s=Math.floor(t/100)%60,m=Math.floor(t/6000);return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')};
const fmtE=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const parse=s=>{s=String(s).trim();if(!s)return null;const p=s.split(':');let v;if(p.length===2)v=(+p[0])*60+(+p[1]);else if(p.length===1)v=+p[0];else return null;return isNaN(v)||v<0?null:Math.round(v*1000)};
const now=()=>S.phase==='race'?performance.now()-S.start:S.final;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>S.order.find(p=>p.id==id);
const ord=i=>(i+1)+(['st','nd','rd'][i]||'th');
const timeAt=(mk,id)=>{const i=mk.actual.indexOf(id);return i>=0&&mk.laps[i]!=null?mk.laps[i]:null};
const KMF=u=>u==='mi'?1.609344:1;
const distKm=k=>(+k.dist>0?+k.dist:0)*KMF(k.unit||S.unit);
const totKm=()=>(+S.total>0?+S.total:0)*KMF(S.unit);
const relabel=(k,i)=>{const d=String(k.dist).trim();k.label=d!==''?(+d>0?String(+d):d)+' '+(k.unit||S.unit):'Marker '+(i+1)};
function paceInfo(id){for(let j=S.markers.length-1;j>=0;j--){const mk=S.markers[j],d=distKm(mk);if(!(d>0))continue;const t=timeAt(mk,id);if(t!=null&&t>0)return{t,d}}return null}

function sortable(el,done){
  el.querySelectorAll('.h').forEach(h=>{
    h.addEventListener('contextmenu',e=>e.preventDefault());
    h.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const row=h.closest('.row');h.setPointerCapture(e.pointerId);
      row.classList.add('drag');document.body.classList.add('dragging');
      const startY=e.clientY,startTop=row.offsetTop;
      const mv=ev=>{
        const others=[...el.children].filter(r=>r!==row);
        let idx=0;
        for(const r of others){const b=r.getBoundingClientRect();if(ev.clientY>b.top+b.height/2)idx++}
        if(idx!==[...el.children].indexOf(row))el.insertBefore(row,others[idx]||null);
        row.style.transform=`translateY(${ev.clientY-startY-(row.offsetTop-startTop)}px) scale(1.02)`;
      };
      const up=()=>{
        h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
        row.style.transform='';row.classList.remove('drag');document.body.classList.remove('dragging');
        done([...el.children].map(r=>r.dataset.id));
      };
      h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
    });
  });
}

function render(){draw();renderModal();flashUI();saveState()}

function draw(){
  if(S.phase[0]==='h')return drawHelper();
  const a=$('#app');
  if(S.phase==='setup'){
    a.innerHTML=`<h1>Race Split Taker</h1>
    ${modeSeg('org')}
    <div class="bar"><button class="s" id="scn">Import code</button><button class="s" id="hst">Saved races</button></div>
    <div class="bar"><button class="s" id="tms">Team presets</button></div>
    <div class="add"><input id="in" placeholder="Add a name" autocomplete="off"><button class="p" id="addb">Add</button></div>
    <p class="hint">Drag ☰ to set your predicted finish order (top = first).</p>
    <div class="list" id="lst">${S.order.map(p=>`<div class="row" data-id="${p.id}"><span class="h">☰</span><span class="nm">${esc(p.name)}</span><button class="x" data-x="${p.id}">×</button></div>`).join('')}</div>
    <h1 style="font-size:16px;margin-top:18px">Markers</h1>
    <p class="hint">Add each point where you’ll take splits by its distance. Markers are named automatically, and each can use miles or kilometers, so you can mix them.</p>
    <div class="add"><input id="mdist" type="number" step="any" min="0" inputmode="decimal" placeholder="Distance"><select id="munit" class="sm"><option value="mi" ${S.munit!=='km'?'selected':''}>mi</option><option value="km" ${S.munit==='km'?'selected':''}>km</option></select><button class="s" id="addmk">Add</button></div>
    <div class="tabs" style="flex-wrap:wrap">${S.marks.map((k,i)=>`<button class="tab" data-m="${i}">${i+1}. ${esc(k.label)} ×</button>`).join('')}</div>
    <button class="p" id="go" style="width:100%;margin-top:6px" ${S.order.length<1?'disabled':''}>Continue</button>`;
    const add=()=>{const v=$('#in').value.trim();if(!v)return;S.order.push({id:S.nid++,name:v});render();$('#in').focus()};
    $('#addb').onclick=add;$('#in').onkeydown=e=>{if(e.key==='Enter')add()};bindSync();$('#hst').onclick=()=>{S.modal={type:'hist'};render()};$('#tms').onclick=()=>{S.modal={type:'teams'};render()};bindSeg();
    a.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.order=S.order.filter(p=>p.id!=b.dataset.x);render()});
    sortable($('#lst'),ids=>{S.order=ids.map(byId);render()});
    const addMk=()=>{const v=$('#mdist').value.trim();if(!(+v>0))return;const k={dist:v,unit:$('#munit').value};relabel(k,0);S.munit=k.unit;S.marks.push(k);S.marks.sort((x,y)=>distKm(x)-distKm(y));render();$('#mdist').focus()};
    $('#addmk').onclick=addMk;$('#mdist').onkeydown=e=>{if(e.key==='Enter')addMk()};$('#munit').onchange=e=>{S.munit=e.target.value};
    a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.marks.splice(+b.dataset.m,1);render()});
    $('#go').onclick=()=>{S.phase='dist';render()};
    return;
  }
  if(S.phase==='dist'){
    a.innerHTML=`<h1>Total distance</h1>
    <p class="hint">Optional. Used with your markers to estimate each runner’s finish time. Skip it to just record splits.</p>
    <label>Unit</label>
    <div class="bar"><button class="tab ${S.unit==='mi'?'on':''}" data-u="mi">Miles</button><button class="tab ${S.unit==='km'?'on':''}" data-u="km">Kilometers</button></div>
    <label>Total race distance (${S.unit})</label>
    <input id="tot" type="number" step="any" min="0" inputmode="decimal" value="${esc(S.total)}" placeholder="e.g. 3.1">
    <div class="bar" style="margin-top:14px"><button class="s" id="back">← Back</button><button class="p" id="next">Continue</button></div>`;
    a.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.unit=b.dataset.u;render()});
    $('#tot').oninput=e=>{S.total=e.target.value};
    $('#back').onclick=()=>{S.phase='setup';render()};$('#next').onclick=()=>{S.phase='ready';render()};
    return;
  }
  if(S.phase==='ready'){
    a.innerHTML=`<h1>Ready to race?</h1>
    <p class="hint">Check the line-up and markers, then start the clock.</p>
    <div class="card"><b>Predicted order</b><ol>${S.order.map(p=>`<li>${esc(p.name)}</li>`).join('')}</ol></div>
    <div class="card"><b>Markers</b>${S.total!==''?`<div class="hint" style="margin:2px 0 0">Total ${esc(S.total)} ${S.unit}</div>`:''}<ol>${mks().map(k=>`<li>${esc(k===S.def&&+S.total>0?S.total+' '+S.unit:k.label)}</li>`).join('')}</ol></div>
    <button class="p lap" id="start">Start race</button>
    <button class="s" id="back" style="width:100%">← Back to edit</button>
    <div class="bar" style="margin-top:12px"><button class="s" id="shr">Share QR</button><button class="s" id="scn">Scan QR</button></div>`;
    $('#start').onclick=startRace;$('#back').onclick=()=>{S.phase='dist';render()};bindSync();
    return;
  }
  const run=S.phase==='race',m=M(),n=m.actual.length,full=m.laps.length>=n;
  let gp=null;
  {const ps=S.order.map(p=>paceInfo(p.id)).filter(Boolean).map(i=>i.t/i.d);if(ps.length)gp=ps.reduce((x,y)=>x+y,0)/ps.length}
  const D=totKm(),cd=distKm(m);
  const estLine=id=>{
    if(!run)return'';
    const inf=paceInfo(id),pc=inf?inf.t/inf.d:gp;if(pc==null)return'';
    const sy=inf?'~':'≈',parts=[];
    if(cd>0&&timeAt(m,id)==null)parts.push('Arr '+sy+fmtE(pc*cd));
    if(D>0)parts.push('Fin '+sy+fmtE(pc*D));
    return parts.join(' · ');
  };
  a.innerHTML=`<h1>${run?'Race in progress':'Race finished'}</h1>
  <div class="clock" id="clk">${fmt(now())}</div>
  ${D>0?`<p class="hint" style="text-align:center;margin-top:-6px">Total distance ${esc(S.total)} ${S.unit}</p>`:''}
  ${run?`<button class="p lap" id="lap" ${full?'disabled':''}>${full?'All splits taken here':'Take split · '+ord(m.laps.length)+' runner'}</button>
  <div class="bar"><button class="s" id="edr">Edit runners</button><button class="s" id="stop">Finish race</button></div>
  <div class="bar"><button class="s" id="shr">Share QR</button><button class="s" id="scn">Scan QR</button></div>`
  :`<div class="bar"><button class="s" id="edr">Edit runners (add / remove)</button></div>
  <div class="bar"><button class="p" id="xl">Export to Excel</button><button class="s" id="cpt">Copy table</button></div>
  <div class="bar"><button class="s" id="shr">Share QR</button><button class="s" id="scn">Scan QR</button></div>
  <div class="bar"><button class="s" id="again">New race (same names)</button><button class="s" id="reset">Start over</button></div>`}
  <div class="tabs">${S.markers.map((k,i)=>`<button class="tab ${i===S.cur?'on':''}" data-t="${i}">${esc(k.label)} · ${k.laps.filter(x=>x!=null).length}/${S.order.length}</button>`).join('')}${run?'<button class="tab" id="addm">+ Marker</button>':''}</div>
  <div class="add"><input id="dst" type="number" step="any" min="0" inputmode="decimal" value="${esc(m.dist)}" placeholder="Distance of this marker"><select id="unt" class="sm"><option value="mi" ${(m.unit||S.unit)==='mi'?'selected':''}>mi</option><option value="km" ${(m.unit||S.unit)==='km'?'selected':''}>km</option></select></div>
  ${run?'':'<p class="hint">Drag names to fix mix-ups. Tap a time to edit it.</p>'}
  <div class="grid"><div class="slots">${m.actual.map((_,i)=>`<div class="slot"><b>${ord(i)}</b><span ${m.laps[i]!=null?`data-ti="${i}"`:''}>${m.laps[i]!=null?fmt(m.laps[i]):'—'}</span><small>${i>0&&m.laps[i]!=null&&m.laps[i-1]!=null?'+'+fmt(m.laps[i]-m.laps[i-1]):''}</small></div>`).join('')}</div>
  <div class="list" id="act">${m.actual.map((id,i)=>{const p=byId(id),pi=S.pred.indexOf(String(id)),d=pi-i,el=estLine(id);
    const badge=pi<0?'<span class="b eq">new</span>':d>0?`<span class="b up">▲${d}</span>`:d<0?`<span class="b dn">▼${-d}</span>`:`<span class="b eq">✓</span>`;
    return `<div class="row" data-id="${id}"><span class="h">☰</span><span class="nm">${esc(p.name)}${el?`<small>${el}</small>`:''}</span>${run?'':`<span class="pd">${pi<0?'Added':'Pred '+(pi+1)}</span>`}${badge}</div>`}).join('')}</div></div>`;
  sortable($('#act'),ids=>{m.actual=ids.map(Number);m.touched=true;render()});
  a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=+b.dataset.t,k=S.markers[t];if(S.phase==='race'&&t>0&&!k.laps.length&&!k.touched)k.actual=[...S.markers[t-1].actual];S.cur=t;render()});
  a.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ti;S.modal={type:'time',i,t:fmt(m.laps[i])};render()});
  $('#unt').onchange=e=>{m.unit=e.target.value;relabel(m,S.cur);render()};
  $('#dst').onchange=e=>{m.dist=e.target.value;relabel(m,S.cur);render()};
  $('#edr').onclick=()=>{S.draft=newDraft();S.modal={type:'runners'};render()};bindSync();
  if($('#xl')){$('#xl').onclick=()=>exportXlsx(S);$('#cpt').onclick=()=>copyTable(S)}
  if(run){$('#lap').onclick=lap;$('#stop').onclick=finish;$('#addm').onclick=addMarker}
  else{$('#again').onclick=()=>{S.phase='setup';render()};$('#reset').onclick=()=>{S.order=[];S.phase='setup';render()}}
}

function est(k){
  const L=M().laps,a=L[k-1],b=L[k];let t=null;
  if(a!=null&&b!=null)t=(a+b)/2;
  else if(a!=null)t=a+((k>=2&&L[k-2]!=null)?a-L[k-2]:1000);
  else if(b!=null)t=Math.max(0,b-1000);
  return t==null?'':fmt(t);
}
const newDraft=()=>{const n=M().actual.length;return{name:'',pos:n,time:est(n)}};

function renderModal(){
  const el=$('#modal'),md=S.modal;
  stopCam();if(!md){el.innerHTML='';return}
  const m=M();
  if(md.type==='resume')return resumeModal(el);if(md.type==='teams')return teamsModal(el);if(md.type==='invite')return inviteModal(el);if(md.type==='hres')return hresModal(el);if(md.type==='hdel')return hdelModal(el);if(md.type==='hist')return histModal(el);if(md.type==='share')return shareModal(el);if(md.type==='scan')return scanModal(el);if(md.type==='time'){
    el.innerHTML=`<div class="ov"><div class="mdl"><h2>Edit time</h2>
    <p class="hint">${ord(md.i)} runner · ${esc(byId(m.actual[md.i]).name)}</p>
    <input id="tt" value="${esc(md.t)}" inputmode="decimal">
    <p class="hint" style="margin-top:6px">Use m:ss.cc or seconds (e.g. 1:05.30 or 65.3)</p>
    <div class="bar"><button class="s" id="mc">Cancel</button><button class="p" id="ms">Save</button></div></div></div>`;
    $('#mc').onclick=()=>{S.modal=null;render()};
    $('#ms').onclick=()=>{const v=parse($('#tt').value);if(v==null){$('#tt').style.borderColor='var(--bad)';return}m.laps[md.i]=v;S.modal=null;render()};
    return;
  }
  const done=S.phase==='done',n=m.actual.length,d=S.draft;
  const nm=i=>esc(byId(m.actual[i]).name);
  const ropts=v=>'<option value="">Choose…</option>'+S.order.map(p=>`<option value="${p.id}" ${String(p.id)===String(v)?'selected':''}>${esc(p.name)}</option>`).join('');
  const opts=[...Array(n+1).keys()].map(k=>`<option value="${k}" ${k===d.pos?'selected':''}>${n===0?'First':k===0?'Before '+nm(0):k===n?'After '+nm(n-1):'Between '+nm(k-1)+' and '+nm(k)}</option>`).join('');
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>Edit runners</h2>

function fillMarker(L,actual,laps,dist){

  let add=0;
  actual.forEach((id,i)=>{if(laps[i]!=null&&!have.has(id)){have.set(id,laps[i]);add++}});
  actual.forEach(id=>{if(!L.actual.includes(id))L.actual.push(id)});
  if(!add)return;
  const timed=L.actual.filter(id=>have.has(id)).sort((x,y)=>have.get(x)-have.get(y));
  const rest=L.actual.filter(id=>!have.has(id));
  L.actual=[...timed,...rest];L.laps=timed.map(id=>have.get(id));
}

  if(S.phase==='race')S.start=performance.now()-(Date.now()-S.epoch);

let SAVE_OK=false;
function restore(){
  let o=null;try{o=JSON.parse(localStorage.getItem('rst-save-v1')||'null')}catch(e){}
  if(!o||!o.phase){SAVE_OK=true;return}
  if(o.phase==='race'){S.pending=o;S.modal={type:'resume'};render();return}
  loadSnap(o);SAVE_OK=true;render();
}
function resumeModal(el){
  const o=S.pending,laps=(o.markers||[]).reduce((a,k)=>a+k.laps.filter(x=>x!=null).length,0);
  const when=new Date(o.epoch).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>Resume last race?</h2>
  <p class="hint">You left a race in progress: ${o.order.length} runner${o.order.length===1?'':'s'}, ${laps} split${laps===1?'':'s'} recorded, started ${esc(when)}. The clock kept running while the app was closed and would now read <b>${fmtE(Math.max(0,Date.now()-o.epoch))}</b>.</p>
  <div class="bar"><button class="s" id="dr">Discard race</button><button class="p" id="rr">Resume race</button></div></div></div>`;
  $('#rr').onclick=()=>{loadSnap(o);S.pending=null;SAVE_OK=true;render();tick();setFlash('Race resumed')};
  $('#dr').onclick=()=>{
    const b=$('#dr');
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to discard';return}
    S.pending=null;S.modal=null;
    Object.assign(S,{phase:'setup',order:o.order||[],pred:[],marks:o.marks||[],def:o.def||{label:'Marker 1',dist:''},total:o.total||'',unit:o.unit||'mi',markers:[],cur:0,nid:o.nid||1,rid:'',epoch:0,final:0});
    SAVE_OK=true;render();setFlash('Race discarded — names kept');
  };
}
function histModal(el){
  const h=getHist();
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>Saved races</h2>
  ${h.length?h.map((e,i)=>`<div class="card"><b>${esc(histTitle(e))}</b><div class="hint" style="margin:2px 0 8px">${e.markers.length} marker${e.markers.length===1?'':'s'}</div><div class="bar" style="margin-bottom:0"><button class="s" data-o="${i}">Open</button><button class="s" data-x="${i}">Excel</button><button class="s" data-d="${i}">Delete</button></div></div>`).join(''):'<p class="hint">No saved races yet. Finished races are saved here automatically.</p>'}
  <div class="bar" style="margin-top:12px"><button class="s" id="mc">Close</button></div></div></div>`;
  $('#mc').onclick=()=>{S.modal=null;render()};
  el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{loadSnap(h[+b.dataset.o]);render()});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>exportXlsx(h[+b.dataset.x]));
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again';return}
    h.splice(+b.dataset.d,1);try{localStorage.setItem('rst-history-v1',JSON.stringify(h))}catch(e){}renderModal();
  });
}
const getTeams=()=>{try{return JSON.parse(localStorage.getItem('rst-teams-v1')||'[]')}catch(e){return[]}};
const setTeams=t=>{try{localStorage.setItem('rst-teams-v1',JSON.stringify(t))}catch(e){}};
function teamsModal(el){
  const t=getTeams();
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>Team presets</h2>
  ${t.length?t.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b><div class="hint" style="margin:2px 0 8px">${x.names.length} runner${x.names.length===1?'':'s'}: ${esc(x.names.slice(0,4).join(', '))}${x.names.length>4?'…':''}</div><div class="bar" style="margin-bottom:0"><button class="s" data-l="${i}">Load</button><button class="s" data-d="${i}">Delete</button></div></div>`).join(''):'<p class="hint">No saved teams yet.</p>'}
  <label>Save the current names as a team</label>
  <div class="add"><input id="tn" placeholder="Team name" value="${esc(S.tdraft)}" autocomplete="off"><button class="p" id="ts" ${S.order.length?'':'disabled'}>Save</button></div>
  <p class="hint">${S.order.length?'Saves the names in their current order. ':'Add names on the first screen, then come back to save them. '}Loading a team replaces the current names — then drag them into your predicted order.</p>
  <div class="bar"><button class="s" id="mc">Close</button></div></div></div>`;
  $('#mc').onclick=()=>{S.modal=null;render()};
  $('#tn').oninput=e=>{S.tdraft=e.target.value};
  $('#ts').onclick=()=>{
    const name=S.tdraft.trim();if(!name||!S.order.length)return;
    const all=getTeams(),i=all.findIndex(x=>x.name.toLowerCase()===name.toLowerCase()),rec={name,names:S.order.map(p=>p.name)};
    if(i>=0)all[i]=rec;else all.push(rec);
    setTeams(all);S.tdraft='';renderModal();setFlash('Team saved');
  };
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
    const x=t[+b.dataset.l];S.order=x.names.map(n=>({id:S.nid++,name:n}));S.modal=null;render();setFlash('Team loaded — drag names into your predicted order');
  });
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again';return}
    t.splice(+b.dataset.d,1);setTeams(t);renderModal();
  });
}
/*HELPER-START*/
let LIVE=0;
function stopLive(){if(LIVE){clearInterval(LIVE);LIVE=0}}
function startLive(fn,ms){stopLive();fn();LIVE=setInterval(fn,ms)}
const jc=p=>'RST1:'+JSON.stringify(p).replace(/[\u007f-\uffff]/g,c=>'\\u'+('0000'+c.charCodeAt(0).toString(16)).slice(-4));
const tod=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+p(Math.floor(d.getMilliseconds()/10))};
const modeSeg=cur=>`<div class="seg"><button class="${cur==='org'?'on':''}" data-md="org">Organizer</button><button class="${cur==='help'?'on':''}" data-md="help">Helper</button></div>`;
function bindSeg(){document.querySelectorAll('#app [data-md]').forEach(b=>b.onclick=()=>{S.phase=b.dataset.md==='org'?'setup':'hhome';render()})}

function invCode(){
  const live=S.phase==='race'||S.phase==='done';
  const r=live?S.rid:(S.invRid||(S.invRid=Math.random().toString(36).slice(2,8)));
  const ms=live?S.markers.map(k=>[k.label,k.dist]):mks().map(k=>[k===S.def&&+S.total>0?S.total+' '+S.unit:k.label,k.dist]);
  return jc({k:'inv',v:1,r,o:S.order.map(x=>[x.id,x.name]),mk:ms,u:S.unit,t:Date.now()});
}
function resCode(){
  const hm=S.hm.filter(k=>k.taps.length),all=hm.flatMap(k=>k.taps),b=all.length?Math.min(...all):0;
  return jc({k:'res',v:1,r:S.hinv.r,tg:Date.now(),cal:S.hinv.A,b,m:hm.map(k=>[k.idx,k.actual,k.taps.map(t=>t-b)])});
}
function importInvite(p,scanAt){
  if(S.phase[0]!=='h'){setFlash('That’s a helper invite — open the Helper tab first');return false}
  if(!Array.isArray(p.o)||!Array.isArray(p.mk))return false;
  S.hinv={r:p.r,o:p.o,mk:p.mk,u:p.u||'',A:(scanAt!=null&&p.t!=null)?p.t-scanAt:null};
  S.hsel=[];S.hm=[];S.hc=0;S.phase='hsetup';S.modal=null;render();
  setFlash(S.hinv.A!=null?'Invite loaded — clock matched':'Invite loaded — clock not matched');return true;
}
function importResult(p,scanAt){
  if(S.phase[0]==='h'){setFlash('Helper results go to the organizer’s phone');return false}
  if(!(S.phase==='race'||S.phase==='done')||!S.epoch){setFlash('Start the race first, then import helper results');return false}
  if(p.r!==S.rid){setFlash('Those results are from a different race');return false}
  const A=p.cal==null?null:p.cal,B=(scanAt!=null&&p.tg!=null)?scanAt-p.tg:null;
  const th=(A!=null&&B!=null)?(A+B)/2:(B!=null?B:(A!=null?A:0));
  let n=0;
  (p.m||[]).forEach(([idx,actual,offs])=>{
    const L=S.markers[idx];if(!L)return;
    const pairs=actual.map((id,i)=>[id,offs[i]==null?null:Math.max(0,p.b+offs[i]+th-S.epoch)]).filter(x=>byId(x[0]));
    fillMarker(L,pairs.map(x=>x[0]),pairs.map(x=>x[1]),'');n++;
  });
  const q=(A!=null&&B!=null)?'clock matched both ways':(A!=null||B!=null)?'clock matched one way':'clock not matched';
  S.modal=null;render();setFlash('Added helper splits to '+n+' marker'+(n===1?'':'s')+' · '+q);return true;
}
function liveModal(el,title,text,codeFn){
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>${title}</h2><p class="hint">${text}</p>
  <div style="text-align:center"><canvas id="qrc" style="width:100%;max-width:340px;border-radius:8px;background:#fff;image-rendering:pixelated"></canvas><p class="hint" id="qrm"></p></div>
  <details><summary class="hint">Text code (can’t match clocks)</summary><textarea id="cd" readonly style="width:100%;height:90px;font-size:12px"></textarea><p class="hint" id="cm" style="margin-top:6px"></p><button class="s" id="cp" style="width:100%">Copy code</button></details>
  <div class="bar" style="margin-top:12px"><button class="s" id="mc">Close</button></div></div></div>`;
  $('#mc').onclick=()=>{S.modal=null;render()};
  $('#cd').value=codeFn();$('#cd').onclick=e=>e.target.select();
  $('#cp').onclick=()=>copyText($('#cd').value,$('#cm'));
  startLive(()=>{const c=$('#qrc');if(c)drawQR(c,codeFn(),$('#qrm'))},400);
}
function inviteModal(el){liveModal(el,'Invite helpers','Helpers open the app, choose the <b>Helper</b> tab, and scan this QR. Finish names and markers before inviting helpers.',invCode)}
function hresModal(el){liveModal(el,'Send to organizer','On the organizer’s phone choose <b>Import code</b> and scan this QR. It changes every second to match clocks, so keep the screen steady until it’s read. You can send again after more splits.',resCode)}
function hdelModal(el){
  const k=S.hm[S.hc],i=S.modal.i;
  el.innerHTML=`<div class="ov"><div class="mdl"><h2>Delete this split?</h2><p class="hint">${ord(i)} split. Splits after it move up one place.</p>
  <div class="bar"><button class="s" id="mc">Cancel</button><button class="p" id="dl">Delete</button></div></div></div>`;
  $('#mc').onclick=()=>{S.modal=null;render()};
  $('#dl').onclick=()=>{k.taps.splice(i,1);S.modal=null;render()};
}
function hlap(){const k=S.hm[S.hc];if(!k||k.taps.length>=k.actual.length)return;k.taps.push(Date.now());render()}
function drawHelper(){
  const a=$('#app'),inv=S.hinv;
  if(S.phase==='hhome'){
    a.innerHTML=`<h1>Race Split Taker</h1>${modeSeg('help')}
    <p class="hint">Helpers time splits for an organizer. Ask the organizer to open <b>Invite helpers</b>, then scan their QR here. You don’t need the race clock — tap <b>Take split</b> each time a runner passes your marker, then drag the names into the order they came by.</p>
    <button class="p" id="hscan" style="width:100%">Scan organizer’s QR</button>
    ${inv?'<button class="s" id="hcont" style="width:100%;margin-top:10px">Continue current helper session</button>':''}
    <p class="hint" style="margin-top:10px">Camera not working? Tap the button above and paste the organizer’s text code instead. Pasted codes can’t match clocks, so scanning is more accurate.</p>`;
    bindSeg();$('#hscan').onclick=()=>{S.modal={type:'scan'};render()};
    if(inv)$('#hcont').onclick=()=>{S.phase=S.hm.length?'htime':'hsetup';render()};
    return;
  }
  if(S.phase==='hsetup'){
    a.innerHTML=`<h1>Which markers are you timing?</h1><p class="hint">${inv.o.length} runners. Pick one or more markers — you can switch between them while timing.</p>
    ${inv.A==null?'<div class="card"><b>Clock not matched</b><div class="hint" style="margin:4px 0 0">You pasted the code instead of scanning it, so this phone’s clock can’t be matched to the organizer’s. Scan the QR with the camera for the most accurate times.</div></div>':''}
    ${inv.mk.map((k,i)=>`<label class="chk"><input type="checkbox" data-s="${i}" ${S.hsel.includes(i)?'checked':''}><span>${esc(k[0])}</span></label>`).join('')}
    <div class="bar" style="margin-top:12px"><button class="s" id="hb">← Back</button><button class="p" id="hgo" ${S.hsel.length?'':'disabled'}>Continue</button></div>`;
    a.querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>{const i=+c.dataset.s;S.hsel=c.checked?[...S.hsel,i].sort((x,y)=>x-y):S.hsel.filter(x=>x!==i);render()});
    $('#hb').onclick=()=>{S.phase='hhome';render()};
    $('#hgo').onclick=()=>{
      const old=new Map(S.hm.map(k=>[k.idx,k]));
      S.hm=S.hsel.map(i=>old.get(i)||{idx:i,label:inv.mk[i][0],dist:inv.mk[i][1],actual:inv.o.map(x=>x[0]),taps:[]});
      S.hc=0;S.phase='htime';render();
    };
    return;
  }
  const k=S.hm[S.hc],n=k.actual.length,full=k.taps.length>=n,nameOf=id=>{const x=inv.o.find(r=>r[0]==id);return x?x[1]:'?'};
  a.innerHTML=`<h1>Timing as helper</h1>
  <p class="hint" style="margin-top:-6px">No stopwatch shown since exact split times are unknown until exported to the organizer.</p>
  <button class="p lap" id="hlap" ${full?'disabled':''}>${full?'All splits taken here':'Take split · '+ord(k.taps.length)+' runner'}</button>
  <div class="bar"><button class="s" id="hundo" ${k.taps.length?'':'disabled'}>Undo last</button><button class="s" id="hsend">Send to organizer</button></div>
  <div class="tabs">${S.hm.map((m,i)=>`<button class="tab ${i===S.hc?'on':''}" data-t="${i}">${esc(m.label)} · ${m.taps.length}/${m.actual.length}</button>`).join('')}</div>
  <p class="hint">Drag ☰ to put names in the order they passed. Gaps show how far behind 1st each runner was. Tap a ✓ to delete a mistaken split.</p>
  <div class="grid"><div class="slots" style="width:108px">${k.actual.map((_,i)=>`<div class="slot" ${i<k.taps.length?`data-ti="${i}" style="cursor:pointer"`:''}><b>${ord(i)}${i<k.taps.length?' ✓':''}</b><span>${i===0&&k.taps.length?'Leader':i>0&&i<k.taps.length?'+'+fmt(k.taps[i]-k.taps[0]):'—'}</span></div>`).join('')}</div>
  <div class="list" id="act">${k.actual.map(id=>`<div class="row" data-id="${id}"><span class="h">☰</span><span class="nm">${esc(nameOf(id))}</span></div>`).join('')}</div></div>
  <div class="bar" style="margin-top:12px"><button class="s" id="hchg">Change markers</button><button class="s" id="hend">End session</button></div>`;
  sortable($('#act'),ids=>{k.actual=ids.map(Number);render()});
  $('#hlap').onclick=hlap;
  $('#hundo').onclick=()=>{k.taps.pop();render()};
  $('#hsend').onclick=()=>{S.modal={type:'hres'};render()};
  a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.hc=+b.dataset.t;render()});
  a.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{S.modal={type:'hdel',i:+b.dataset.ti};render()});
  $('#hchg').onclick=()=>{S.phase='hsetup';render()};
  $('#hend').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again — discards times';return}S.hinv=null;S.hm=[];S.hsel=[];S.hc=0;S.phase='hhome';render()};
}
/*HELPER-END*/
function mergeRunners(a,b){
  S.markers.forEach(L=>{
    const ib=L.actual.indexOf(b);if(ib<0)return;
    const ia=L.actual.indexOf(a);
    const ta=ia>=0&&L.laps[ia]!=null?L.laps[ia]:null,tb=L.laps[ib]!=null?L.laps[ib]:null;
    if(ia<0){L.actual[ib]=a;return}
    if(ta==null&&tb!=null){
      const have=new Map();L.actual.forEach((id,i)=>{if(L.laps[i]!=null)have.set(id,L.laps[i])});
      have.delete(b);have.set(a,tb);
      L.actual=L.actual.filter(id=>id!==b);
      const timed=L.actual.filter(id=>have.has(id)).sort((x,y)=>have.get(x)-have.get(y));
      const rest=L.actual.filter(id=>!have.has(id));
      L.actual=[...timed,...rest];L.laps=timed.map(id=>have.get(id));
    }else{L.actual.splice(ib,1);if(ib<L.laps.length)L.laps.splice(ib,1)}
  });
  const pa=S.pred.indexOf(String(a)),pb=S.pred.indexOf(String(b));
  if(pb>=0){if(pa<0)S.pred[pb]=String(a);else S.pred.splice(pb,1)}
  S.order=S.order.filter(p=>p.id!==b);
}
function addRunner(name,pos,t){
  const id=S.nid++;S.order.push({id,name});
  S.markers.forEach((k,mi)=>{
    if(S.phase==='done'&&mi===S.cur){
      const at=Math.min(pos,k.actual.length);
      k.actual.splice(at,0,id);
      while(k.laps.length<at)k.laps.push(null);
      k.laps.splice(at,0,t);
    }else k.actual.push(id);
  });
}
function removeRunner(id){
  S.order=S.order.filter(p=>p.id!==id);S.pred=S.pred.filter(x=>x!==String(id));
  S.markers.forEach(k=>{const i=k.actual.indexOf(id);if(i<0)return;k.actual.splice(i,1);if(i<k.laps.length)k.laps.splice(i,1)});
}
function startRace(){
  S.pred=S.order.map(p=>String(p.id));
  S.markers=mks().map((k,i)=>{const useTot=!S.marks.length&&k.dist===''&&+S.total>0;const m={label:k.label,dist:useTot?S.total:k.dist,unit:useTot?S.unit:(k.unit||S.unit),actual:S.order.map(p=>p.id),laps:[]};relabel(m,i);return m});S.cur=0;
  S.final=0;S.rid=S.invRid||Math.random().toString(36).slice(2,8);S.invRid='';S.epoch=Date.now();S.phase='race';S.start=performance.now();render();tick();
}
function addMarker(){
  S.markers.push({label:'Marker '+(S.markers.length+1),dist:'',unit:M().unit||S.unit,actual:[...M().actual],laps:[]});
  S.cur=S.markers.length-1;render();
}
function tick(){const c=$('#clk');if(c&&S.phase==='race')c.textContent=fmt(now());if(S.phase==='race')S.raf=requestAnimationFrame(tick)}
function lap(){
  if(S.phase!=='race')return;const m=M();
  if(m.laps.length>=m.actual.length)return;
  m.laps.push(performance.now()-S.start);render();
}
function finish(){
  if(S.phase!=='race')return;
  S.final=performance.now()-S.start;S.phase='done';cancelAnimationFrame(S.raf);render();
}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!S.modal&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){if(S.phase==='race'){e.preventDefault();lap()}else if(S.phase==='htime'){e.preventDefault();hlap()}}});
render();
try{restore()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
